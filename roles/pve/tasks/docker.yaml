- name: Create docker directory on PVE host
  ansible.builtin.file:
    dest: /opt/docker
    state: directory
    owner: "{{ secret_username}}"
    group: "{{ secret_username }}"
    mode: "{{ docker_dir_mask }}" 

- name: Setup docker to run in ZFS
  ansible.builtin.copy:
    src: files/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: 0775

# The scrutiny_collector role owns the collector configuration and container.
# Do not recreate the obsolete collector from /opt/docker/docker-compose.yaml.
