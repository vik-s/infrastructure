[tank]
{% if backup_server %}
    use_template = archive
{% else %}
    use_template = production
{% endif %}
    recursive = true
    process_children_only = true 

{% if backup_server %}
[{{ syncoid_target_root }}]
    use_template = production
    recursive = true
    process_children_only = true

[template_archive]
    autosnap = no
    autoprune = no

{% else %}
[rpool/docker]
    use_template = production
    recursive = false 
{% endif %}

[template_production]
    frequently = 0
    hourly = 36
    daily = 30
    monthly = 1
    yearly = 1
{% if backup_server %}
    autosnap = no
{% else %}
    autosnap = yes
{% endif %}
    autoprune = yes
