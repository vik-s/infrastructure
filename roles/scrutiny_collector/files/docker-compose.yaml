version: '3.9'

services:
  scrutiny-collector:
    image: '{{ scrutiny_collector_image }}'
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO
    environment:
      - COLLECTOR_RUN_STARTUP=true
      - COLLECTOR_RUN_STARTUP_SLEEP=10
    volumes:
      - '/opt/docker/scrutiny-collector/collector.yaml:/opt/scrutiny/config/collector.yaml:ro'
      - '/run/udev:/run/udev:ro'
    restart: unless-stopped
    devices:
{% for mapping in scrutiny_collector_devices[collector_config] %}
      - '{{ mapping }}'
{% endfor %}
